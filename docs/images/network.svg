<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="The network: 1x45x150 input, four conv blocks (32, 64, 128, 192 channels), mean over height, linear 512, five heads of 37 classes">
  <style>
    .t{font-family:Helvetica,Arial,sans-serif;fill:#111827}
    .s{font-size:15px;fill:#4b5563}
    .h{font-size:18px;font-weight:700}
  </style>
  <rect width="1280" height="360" fill="#f6f8f7"/>
  <text x="24" y="38" class="t" font-size="24" font-weight="700">The network: 1,819,929 weights, 5 outputs</text>
  <g stroke="#007467" stroke-width="3" fill="#fff">
    <rect x="24" y="110" width="120" height="120" rx="10"/>
    <rect x="176" y="90" width="120" height="160" rx="10" fill="#e3f4f1"/>
    <rect x="308" y="90" width="120" height="160" rx="10" fill="#e3f4f1"/>
    <rect x="440" y="90" width="120" height="160" rx="10" fill="#e3f4f1"/>
    <rect x="572" y="90" width="120" height="160" rx="10" fill="#e3f4f1"/>
    <rect x="724" y="110" width="110" height="120" rx="10"/>
    <rect x="866" y="110" width="110" height="120" rx="10"/>
  </g>
  <g stroke="#b3231b" stroke-width="3" fill="#fff">
    <rect x="1008" y="70" width="236" height="40" rx="8"/><rect x="1008" y="118" width="236" height="40" rx="8"/>
    <rect x="1008" y="166" width="236" height="40" rx="8"/><rect x="1008" y="214" width="236" height="40" rx="8"/>
    <rect x="1008" y="262" width="236" height="40" rx="8"/>
  </g>
  <g stroke="#4b5563" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M146 170 h28"/><path d="M298 170 h8"/><path d="M430 170 h8"/><path d="M562 170 h8"/><path d="M694 170 h28"/><path d="M836 170 h28"/>
    <path d="M978 170 C990 170 994 90 1006 90"/><path d="M978 170 C990 170 994 138 1006 138"/><path d="M978 170 h28"/><path d="M978 170 C990 170 994 234 1006 234"/><path d="M978 170 C990 170 994 282 1006 282"/>
  </g>
  <g class="t" text-anchor="middle">
    <text x="84" y="148" class="h">Image</text><text x="84" y="170" class="s">1 x 45 x 150</text><text x="84" y="190" class="s">letter 1, blob .5,</text><text x="84" y="208" class="s">paper 0</text>
    <text x="236" y="150" class="h">Block 1</text><text x="236" y="172" class="s">2 x conv3x3</text><text x="236" y="192" class="s">32 ch, ReLU</text><text x="236" y="212" class="s">max-pool 2</text>
    <text x="368" y="150" class="h">Block 2</text><text x="368" y="172" class="s">2 x conv3x3</text><text x="368" y="192" class="s">64 ch, ReLU</text><text x="368" y="212" class="s">max-pool 2</text>
    <text x="500" y="150" class="h">Block 3</text><text x="500" y="172" class="s">2 x conv3x3</text><text x="500" y="192" class="s">128 ch, ReLU</text><text x="500" y="212" class="s">max-pool 2</text>
    <text x="632" y="150" class="h">Block 4</text><text x="632" y="172" class="s">2 x conv3x3</text><text x="632" y="192" class="s">192 ch, ReLU</text><text x="632" y="212" class="s">max-pool 2</text>
    <text x="779" y="160" class="h">Mean</text><text x="779" y="182" class="s">over height</text><text x="779" y="202" class="s">192 x 9 = 1,728</text>
    <text x="921" y="160" class="h">Linear</text><text x="921" y="182" class="s">512, ReLU</text>
    <text x="1126" y="96" class="h">character 1: 37</text><text x="1126" y="144" class="h">character 2: 37</text><text x="1126" y="192" class="h">character 3: 37</text><text x="1126" y="240" class="h">character 4: 37</text><text x="1126" y="288" class="h">character 5: 37</text>
    <text x="24" y="336" class="s" text-anchor="start">Batch normalisation is folded into the convolutions at export, so the browser only needs conv, ReLU, max-pool and linear.</text>
  </g>
</svg>
